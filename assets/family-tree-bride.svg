<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 288" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&amp;family=Pretendard:wght@400;600;700&amp;display=swap');
      .tree-bg { fill: #F4EDE1; rx: 16; }
      .tree-title { font-family: 'Gowun Batang', serif; font-size: 17px; font-weight: 700; fill: #3A2F24; text-anchor: middle; letter-spacing: -0.01em; }
      .line { stroke: #CEBDA5; stroke-width: 1.8; stroke-linecap: round; fill: none; }
      .line-couple { stroke: #BA9D6C; stroke-width: 1.8; stroke-dasharray: 4 3; }
      .card-bg { fill: #FAF6EE; stroke: #DECDB7; stroke-width: 1.4; rx: 11; filter: drop-shadow(0 2px 4px rgba(60, 45, 30, 0.05)); }
      .card-highlight { fill: #FAF1EE; stroke: #8F3E36; stroke-width: 2.2; rx: 12; filter: drop-shadow(0 3px 8px rgba(143, 62, 54, 0.12)); }
      .card-accent { fill: #F6EFE3; stroke: #D8C5AE; stroke-width: 1.4; rx: 11; }
      .badge-parent { fill: #E8DDCE; rx: 5; }
      .badge-parent-text { font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 600; fill: #5C4C3C; text-anchor: middle; }
      .badge-bride { fill: #8F3E36; rx: 5; }
      .badge-bride-text { font-family: 'Pretendard', sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .badge-role { fill: #EEE5D7; rx: 5; }
      .badge-role-text { font-family: 'Pretendard', sans-serif; font-size: 11.5px; font-weight: 600; fill: #695745; text-anchor: middle; }
      .badge-child { fill: #F4E8D6; rx: 5; }
      .badge-child-text { font-family: 'Pretendard', sans-serif; font-size: 11px; font-weight: 600; fill: #855E2B; text-anchor: middle; }
      .name-text { font-family: 'Gowun Batang', serif; font-size: 17px; font-weight: 700; fill: #261F18; text-anchor: middle; }
      .name-highlight { font-family: 'Gowun Batang', serif; font-size: 20px; font-weight: 700; fill: #5E261E; text-anchor: middle; }
      .name-child { font-family: 'Pretendard', sans-serif; font-size: 14.5px; font-weight: 700; fill: #362B20; text-anchor: middle; }
    </style>
  </defs>

  <!-- 배경 테두리 -->
  <rect width="460" height="288" class="tree-bg" />
  <rect x="4" y="4" width="452" height="280" fill="none" stroke="#DFCDB7" stroke-width="1.2" rx="13" />

  <!-- 상단 가문 타이틀 -->
  <g transform="translate(195, 27)">
    <text y="0" class="tree-title">신부 김희수 측 가족관계도</text>
  </g>

  <!-- 우측 상단 참석 안내 뱃지 -->
  <g transform="translate(390, 26)">
    <rect x="-48" y="-12" width="96" height="24" rx="12" fill="#FAF6EE" stroke="#DECDB7" stroke-width="1.2" />
    <text x="0" y="4" font-family="'Pretendard', sans-serif" font-size="11.5px" font-weight="700" fill="#594838" text-anchor="middle">참석 인원: 총 7명</text>
  </g>

  <!-- ==================== 1세대: 부모님 ==================== -->
  <!-- 부부선 -->
  <line x1="195" y1="74" x2="265" y2="74" class="line-couple" />
  <circle cx="230" cy="74" r="3.5" fill="#BA9D6C" />

  <!-- 아버지: 김민수 -->
  <g transform="translate(95, 46)">
    <rect width="100" height="56" class="card-bg" />
    <rect x="26" y="7" width="48" height="18" class="badge-parent" />
    <text x="50" y="20.5" class="badge-parent-text">아버지</text>
    <text x="50" y="47" class="name-text">김민수</text>
  </g>

  <!-- 어머니: 김선미 -->
  <g transform="translate(265, 46)">
    <rect width="100" height="56" class="card-bg" />
    <rect x="26" y="7" width="48" height="18" class="badge-parent" />
    <text x="50" y="20.5" class="badge-parent-text">어머니</text>
    <text x="50" y="47" class="name-text">김선미</text>
  </g>

  <!-- 1세대 -> 2세대 줄기 -->
  <line x1="230" y1="78" x2="230" y2="116" class="line" />
  <!-- 2세대 3남매 연결 가로선 -->
  <line x1="52" y1="116" x2="397" y2="116" class="line" />
  <line x1="52" y1="116" x2="52" y2="137" class="line" />
  <line x1="266" y1="116" x2="266" y2="132" class="line" />
  <line x1="397" y1="116" x2="397" y2="137" class="line" />

  <!-- ==================== 2세대: 자녀들 ==================== -->

  <!-- [언니 & 형부 부부선] -->
  <line x1="90" y1="168" x2="114" y2="168" class="line-couple" />
  <circle cx="102" cy="168" r="3.5" fill="#BA9D6C" />

  <!-- 맏언니: 김희선 -->
  <g transform="translate(14, 137)">
    <rect width="76" height="62" class="card-accent" />
    <rect x="18" y="8" width="40" height="18" class="badge-role" />
    <text x="38" y="21" class="badge-role-text">언니</text>
    <text x="38" y="50" class="name-text">김희선</text>
  </g>

  <!-- 형부: 김수원 -->
  <g transform="translate(114, 137)">
    <rect width="72" height="62" class="card-bg" />
    <rect x="18" y="8" width="36" height="18" class="badge-role" />
    <text x="36" y="21" class="badge-role-text">형부</text>
    <text x="36" y="50" class="name-text">김수원</text>
  </g>

  <!-- [둘째 딸 / 예비 신부]: 김희수 -->
  <g transform="translate(196, 132)">
    <rect width="140" height="72" class="card-highlight" />
    <rect x="23" y="8" width="94" height="21" class="badge-bride" />
    <text x="70" y="23" class="badge-bride-text">예비 신부 · 둘째 딸</text>
    <text x="70" y="52" class="name-highlight">김희수</text>
    <text x="70" y="66" font-family="'Pretendard', sans-serif" font-size="10.5px" font-weight="600" fill="#8F3E36" text-anchor="middle">예쁘고 화목한 가정의 시작</text>
  </g>

  <!-- [막내 / 남동생]: 김지훈 -->
  <g transform="translate(348, 137)">
    <rect width="98" height="62" class="card-bg" />
    <rect x="26" y="8" width="46" height="18" class="badge-role" />
    <text x="49" y="21" class="badge-role-text">남동생</text>
    <text x="49" y="50" class="name-text">김지훈</text>
  </g>

  <!-- ==================== 3세대: 조카들 ==================== -->
  <!-- 언니네 부부 -> 3세대 연결선 -->
  <line x1="102" y1="171" x2="102" y2="215" class="line" />
  <line x1="55" y1="215" x2="152" y2="215" class="line" />
  <line x1="55" y1="215" x2="55" y2="224" class="line" />
  <line x1="152" y1="215" x2="152" y2="224" class="line" />

  <!-- 첫째 조카: 김서아 -->
  <g transform="translate(10, 224)">
    <rect width="90" height="50" class="card-bg" stroke="#DECDB7" />
    <rect x="16" y="7" width="58" height="16" class="badge-child" />
    <text x="45" y="19" class="badge-child-text">첫째 조카</text>
    <text x="45" y="42" class="name-child">김서아</text>
  </g>

  <!-- 둘째 조카: 쑥쑥이 -->
  <g transform="translate(107, 224)">
    <rect width="90" height="50" class="card-bg" stroke="#DECDB7" />
    <rect x="15" y="7" width="60" height="16" class="badge-child" />
    <text x="45" y="19" class="badge-child-text">둘째 조카</text>
    <text x="45" y="42" class="name-child">쑥쑥이</text>
  </g>

</svg>
